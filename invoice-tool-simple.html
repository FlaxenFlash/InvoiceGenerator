<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Lato', sans-serif; font-size: 14px; color: #222; background: #f0f0f0; }
#app { display: flex; min-height: 100vh; }

/* ── EDITOR ── */
#editor { width: 340px; min-width: 280px; background: #fff; border-right: 1px solid #ddd; padding: 16px; overflow-y: auto; flex-shrink: 0; }
#editor h2 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #555; margin: 0 0 12px; }
.section { margin-bottom: 18px; }
.section-title { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #888; margin-bottom: 6px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
label { display: block; font-size: 11px; color: #666; margin-bottom: 2px; margin-top: 6px; }
input[type=text], input[type=number], input[type=date], select, textarea {
  width: 100%; padding: 5px 7px; font-size: 12px; font-family: inherit;
  border: 1px solid #ccc; border-radius: 3px; background: #fafafa; color: #222;
}
textarea { resize: vertical; min-height: 52px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.prefix-row { display: flex; gap: 4px; }
.prefix-row input:first-child { width: 70px; flex-shrink: 0; }
.preview-num { font-size: 10px; color: #888; margin-top: 2px; }
.rate-row { display: flex; gap: 4px; align-items: flex-end; }
.rate-row input { flex: 1; }

/* line items */
.li-header { display: grid; grid-template-columns: 1fr 44px 72px 28px; gap: 4px; margin-bottom: 2px; }
.li-col { font-size: 10px; color: #888; }
.li-row { display: grid; grid-template-columns: 1fr 44px 72px 28px; gap: 4px; margin-bottom: 4px; align-items: center; }
.li-row input { font-size: 12px; padding: 4px 5px; }
.rm-btn { background: none; border: 1px solid #ccc; border-radius: 3px; cursor: pointer; color: #999; font-size: 14px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
.rm-btn:hover { background: #fee; border-color: #d88; color: #c33; }
.add-li { font-size: 11px; background: #f5f5f5; border: 1px solid #ccc; border-radius: 3px; padding: 4px 10px; cursor: pointer; margin-top: 2px; font-family: inherit; }
.add-li:hover { background: #eee; }

/* summary */
.summary-box { background: #f7f7f7; border: 1px solid #ddd; border-radius: 3px; padding: 8px 10px; margin-top: 8px; font-size: 13px; }
.sum-total { display: flex; justify-content: space-between; font-weight: 700; color: #222; }

/* buttons */
.print-btn { width: 100%; padding: 10px; font-size: 13px; font-weight: 700; background: #1a1a1a; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-family: inherit; letter-spacing: .04em; margin-top: 4px; }
.print-btn:hover { background: #333; }
.sm-btn { font-size: 11px; padding: 4px 9px; background: #eee; border: 1px solid #ccc; border-radius: 3px; cursor: pointer; font-family: inherit; white-space: nowrap; }
.sm-btn:hover { background: #ddd; }
.sm-btn.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.sm-btn.primary:hover { background: #333; }
.sm-btn.danger { color: #c33; }
.sm-btn.danger:hover { background: #fee; border-color: #d88; }
.btn-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }

/* client config panel */
.client-config { background: #f7f7f7; border: 1px solid #ddd; border-radius: 4px; padding: 8px 10px; margin-top: 6px; }
.client-config select { margin-bottom: 6px; }
.folder-status { font-size: 10px; color: #888; margin-top: 4px; }
.folder-status.ok { color: #3a7a3a; }

/* toast */
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: #222; color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 999; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── PREVIEW ── */
#preview-wrap { flex: 1; overflow-y: auto; display: flex; justify-content: center; padding: 24px 16px; background: #e8e8e8; }
#preview-page { background: #fff; width: 794px; min-height: 1123px; padding: 56px; box-shadow: 0 2px 20px rgba(0,0,0,.18); }

.inv-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
.inv-title { font-size: 36px; font-weight: 400; letter-spacing: .04em; text-align: right; color: #111; }
.inv-from { text-align: right; font-size: 12.5px; line-height: 1.55; color: #222; }
.inv-from strong { font-weight: 700; }
.inv-meta-bar { display: flex; justify-content: space-between; align-items: center; background: #f0f0f0; padding: 10px 16px; margin-bottom: 20px; }
.inv-meta-left { font-size: 12.5px; line-height: 1.7; }
.inv-meta-left strong { font-weight: 700; }
.inv-amount-due { text-align: right; }
.inv-amount-due .big-amount { font-size: 26px; font-weight: 400; color: #111; }
.inv-amount-due .amt-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #444; margin-top: 2px; }
.inv-bill-to { margin-bottom: 24px; }
.inv-bill-to .bt-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.inv-bill-to .bt-body { font-size: 12.5px; line-height: 1.6; }
.inv-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
.inv-table thead tr { border-bottom: 2px solid #222; }
.inv-table th { font-size: 12px; font-weight: 700; padding: 6px 4px; text-align: left; }
.inv-table th.r { text-align: right; }
.inv-table tbody tr { border-bottom: 1px solid #ddd; }
.inv-table tbody tr:last-child { border-bottom: none; }
.inv-table td { font-size: 12.5px; padding: 6px 4px; vertical-align: top; }
.inv-table td.r { text-align: right; }
.inv-table td.c { text-align: center; }
.inv-totals { margin-left: auto; width: 300px; }
.inv-totals-row { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; color: #111; border-top: 2px solid #222; padding-top: 6px; }
.inv-notes { margin-top: 32px; padding-top: 16px; border-top: 1px solid #ddd; font-size: 12px; color: #555; line-height: 1.6; }
.inv-notes strong { color: #333; }

/* ── PRINT ── */
@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body { background: #fff !important; }
  #editor { display: none !important; }
  #preview-wrap { background: none !important; padding: 0 !important; display: block !important; }
  #preview-page { box-shadow: none !important; padding: 20mm 18mm !important; width: 100% !important; min-height: unset !important; }
  .inv-meta-bar { background: #f0f0f0 !important; }
}
</style>
</head>
<body>
<div id="app">

<!-- ══ EDITOR ══ -->
<div id="editor">
  <h2>Invoice Tool</h2>

  <!-- Invoice details -->
  <div class="section">
    <div class="section-title">Invoice details</div>
    <label>Invoice number prefix &amp; number</label>
    <div class="prefix-row">
      <input type="text" id="inv-prefix" value="INV-" oninput="onInvNumberChange()">
      <input type="text" id="inv-number" value="0001" oninput="onInvNumberChange()">
    </div>
    <div class="preview-num" id="inv-preview">→ INV-0001</div>
    <div class="row2" style="margin-top:6px">
      <div><label>Invoice date</label><input type="date" id="inv-date" oninput="render()"></div>
      <div><label>Due date</label><input type="date" id="due-date" oninput="render()"></div>
    </div>
  </div>

  <!-- From -->
  <div class="section">
    <div class="section-title">From (your business)</div>
    <textarea id="from-name" rows="1" placeholder="Your name or company name" oninput="onFromChange()"></textarea>
    <textarea id="from-addr" rows="3" placeholder="Your address" oninput="onFromChange()"></textarea>
  </div>

  <!-- Client configs -->
  <div class="section">
    <div class="section-title">Client profiles</div>
    <div class="client-config">
      <label>Config folder</label>
      <div class="btn-row">
        <button class="sm-btn" onclick="selectFolder()">📁 Select folder…</button>
        <button class="sm-btn danger" id="forget-folder-btn" onclick="forgetFolder()" style="display:none">✕ Forget</button>
      </div>
      <div class="folder-status" id="folder-status">No folder selected</div>

      <label style="margin-top:10px">Load client profile</label>
      <select id="client-select" onchange="onClientSelect()">
        <option value="">— select a profile —</option>
      </select>

      <label>Save current "Bill To" as profile</label>
      <div class="rate-row" style="margin-top:2px">
        <input type="text" id="save-client-name" placeholder="Profile filename (no extension)">
        <button class="sm-btn primary" onclick="saveClientProfile()">Save</button>
      </div>
      <div class="btn-row" style="margin-top:4px">
        <button class="sm-btn" onclick="refreshClientList()">↻ Refresh list</button>
        <button class="sm-btn danger" id="delete-profile-btn" onclick="deleteClientProfile()" style="display:none">🗑 Delete selected</button>
      </div>
    </div>
  </div>

  <!-- Bill to -->
  <div class="section">
    <div class="section-title">Bill to (client)</div>
    <textarea id="to-info" rows="4" placeholder="Client name&#10;Address" oninput="render()"></textarea>
  </div>

  <!-- Line items -->
  <div class="section">
    <div class="section-title">Line items (£)</div>
    <div class="li-header">
      <span class="li-col">Description</span>
      <span class="li-col" style="text-align:center">Qty</span>
      <span class="li-col" style="text-align:right">Price £</span>
      <span></span>
    </div>
    <div id="line-items"></div>
    <button class="add-li" onclick="addLine()">+ Add item</button>
    <div class="summary-box">
      <div class="sum-total"><span>Total</span><span id="s-total">£0.00</span></div>
    </div>
  </div>

  <!-- Notes -->
  <div class="section">
    <div class="section-title">Notes / payment details</div>
    <textarea id="notes" rows="3" placeholder="Bank details, payment terms…" oninput="onNotesChange()"></textarea>
  </div>

  <button class="print-btn" onclick="window.print()">🖨 Print / Save as PDF</button>
</div>

<!-- ══ PREVIEW ══ -->
<div id="preview-wrap">
  <div id="preview-page">
    <div class="inv-top">
      <div></div>
      <div style="text-align:right">
        <div class="inv-title">INVOICE</div>
        <div class="inv-from" id="pv-from"></div>
      </div>
    </div>
    <div class="inv-meta-bar">
      <div class="inv-meta-left" id="pv-meta"></div>
      <div class="inv-amount-due">
        <div class="big-amount" id="pv-amount"></div>
        <div class="amt-label">Amount Due</div>
      </div>
    </div>
    <div class="inv-bill-to">
      <div class="bt-label">Bill To</div>
      <div class="bt-body" id="pv-billto"></div>
    </div>
    <table class="inv-table">
      <thead>
        <tr>
          <th style="width:32px">Qty</th>
          <th>Items and Description</th>
          <th class="r" style="width:110px">Price</th>
          <th class="r" style="width:120px">Amount</th>
        </tr>
      </thead>
      <tbody id="pv-lines"></tbody>
    </table>
    <div class="inv-totals" id="pv-totals"></div>
    <div class="inv-notes" id="pv-notes" style="display:none"></div>
  </div>
</div>

</div>
<div id="toast"></div>

<script>
// ══ STATE ══
let lcId = 0;
let dirHandle = null;       // FileSystemDirectoryHandle
let clientFiles = [];       // [{name, handle}]

// ══ TOAST ══
function toast(msg, duration = 2200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

// ══ LOCALSTORAGE: remember invoice number, sender details and notes ══
function store(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }
function recall(key)     { try { return localStorage.getItem(key); } catch(e) { return null; } }

function onInvNumberChange() {
  store('inv_prefix', document.getElementById('inv-prefix').value);
  store('inv_number', document.getElementById('inv-number').value);
  render();
}
function onFromChange() {
  store('inv_from_name', document.getElementById('from-name').value);
  store('inv_from_addr', document.getElementById('from-addr').value);
  render();
}
function onNotesChange() {
  store('inv_notes', document.getElementById('notes').value);
  render();
}

function loadSaved() {
  const map = { 'inv-prefix': 'inv_prefix', 'inv-number': 'inv_number', 'from-name': 'inv_from_name', 'from-addr': 'inv_from_addr', 'notes': 'inv_notes' };
  for (const id in map) {
    const v = recall(map[id]);
    if (v !== null) document.getElementById(id).value = v;
  }
}

// ══ LINE ITEMS ══
function addLine(desc='', qty=1, price='') {
  const id = lcId++;
  const wrap = document.getElementById('line-items');
  const row = document.createElement('div');
  row.className = 'li-row'; row.id = 'li-' + id;
  row.innerHTML =
    '<input type="text" placeholder="Description" value="' + esc(desc) + '" oninput="render()">' +
    '<input type="number" min="0" step="0.01" value="' + qty + '" style="text-align:center" oninput="render()">' +
    '<input type="number" min="0" step="0.01" placeholder="0.00" value="' + (price||'') + '" style="text-align:right" oninput="render()">' +
    '<button class="rm-btn" onclick="removeLine(' + id + ')">×</button>';
  wrap.appendChild(row);
  render();
}
function removeLine(id) {
  const el = document.getElementById('li-' + id);
  if (el) { el.remove(); render(); }
}

// ══ FOLDER / CLIENT PROFILES ══
async function selectFolder() {
  if (!('showDirectoryPicker' in window)) {
    alert('Your browser does not support the File System Access API.\nPlease use Chrome or Edge 86+.');
    return;
  }
  try {
    dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    updateFolderUI();
    await refreshClientList();
  } catch(e) {
    if (e.name !== 'AbortError') console.error(e);
  }
}

function forgetFolder() {
  dirHandle = null;
  clientFiles = [];
  updateFolderUI();
  populateClientSelect();
}

function updateFolderUI() {
  const statusEl = document.getElementById('folder-status');
  const forgetBtn = document.getElementById('forget-folder-btn');
  if (dirHandle) {
    statusEl.textContent = '📁 ' + dirHandle.name;
    statusEl.className = 'folder-status ok';
    forgetBtn.style.display = '';
  } else {
    statusEl.textContent = 'No folder selected';
    statusEl.className = 'folder-status';
    forgetBtn.style.display = 'none';
  }
}

async function refreshClientList() {
  if (!dirHandle) return;
  clientFiles = [];
  for await (const [name, handle] of dirHandle.entries()) {
    if (handle.kind === 'file' && name.endsWith('.json')) {
      clientFiles.push({ name: name.replace(/\.json$/, ''), handle });
    }
  }
  clientFiles.sort((a, b) => a.name.localeCompare(b.name));
  populateClientSelect();
  toast('Refreshed — ' + clientFiles.length + ' profile(s) found');
}

function populateClientSelect() {
  const sel = document.getElementById('client-select');
  const prev = sel.value;
  sel.innerHTML = '<option value="">— select a profile —</option>';
  clientFiles.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f.name;
    opt.textContent = f.name;
    sel.appendChild(opt);
  });
  if (prev && clientFiles.find(f => f.name === prev)) sel.value = prev;
  document.getElementById('delete-profile-btn').style.display = sel.value ? '' : 'none';
}

async function onClientSelect() {
  const sel = document.getElementById('client-select');
  const name = sel.value;
  document.getElementById('delete-profile-btn').style.display = name ? '' : 'none';
  if (!name) return;

  const entry = clientFiles.find(f => f.name === name);
  if (!entry) return;
  try {
    const file = await entry.handle.getFile();
    const data = JSON.parse(await file.text());
    if (data.toInfo !== undefined) document.getElementById('to-info').value = data.toInfo;
    if (data.saveClientName !== undefined) document.getElementById('save-client-name').value = data.saveClientName || name;
    render();
    toast('Loaded: ' + name);
  } catch(e) {
    toast('Error loading profile');
    console.error(e);
  }
}

async function saveClientProfile() {
  if (!dirHandle) { toast('Select a folder first'); return; }
  const rawName = document.getElementById('save-client-name').value.trim();
  if (!rawName) { toast('Enter a filename first'); return; }
  const safeName = rawName.replace(/[/\\:*?"<>|]/g, '_');
  const filename = safeName + '.json';

  const data = {
    toInfo: document.getElementById('to-info').value,
    saveClientName: rawName,
  };

  try {
    const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
    const writable   = await fileHandle.createWritable();
    await writable.write(JSON.stringify(data, null, 2));
    await writable.close();
    await refreshClientList();
    document.getElementById('client-select').value = safeName;
    document.getElementById('delete-profile-btn').style.display = '';
    toast('Saved: ' + filename);
  } catch(e) {
    toast('Error saving profile');
    console.error(e);
  }
}

async function deleteClientProfile() {
  const name = document.getElementById('client-select').value;
  if (!name || !dirHandle) return;
  if (!confirm('Delete profile "' + name + '"?')) return;
  try {
    await dirHandle.removeEntry(name + '.json');
    await refreshClientList();
    toast('Deleted: ' + name);
  } catch(e) {
    toast('Error deleting profile');
    console.error(e);
  }
}

// ══ HELPERS ══
function fmtGBP(n) { return '£' + n.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function escHTML(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nl2br(s)  { return escHTML(s).replace(/\n/g,'<br>'); }
function esc(s)    { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

function formatDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d + ' ' + months[parseInt(m,10)-1] + ' ' + y;
}

// ══ RENDER ══
function render() {
  const invNum = document.getElementById('inv-prefix').value + document.getElementById('inv-number').value;
  document.getElementById('inv-preview').textContent = '→ ' + invNum;

  const invDate  = document.getElementById('inv-date').value;
  const dueDate  = document.getElementById('due-date').value;
  const fromName = document.getElementById('from-name').value;
  const fromAddr = document.getElementById('from-addr').value;
  const toInfo   = document.getElementById('to-info').value;
  const notes    = document.getElementById('notes').value;

  // Line items
  let total = 0;
  let tableHTML = '';
  document.querySelectorAll('.li-row[id^="li-"]').forEach(row => {
    const inp   = row.querySelectorAll('input');
    const desc  = inp[0].value || '';
    const qty   = parseFloat(inp[1].value) || 0;
    const price = parseFloat(inp[2].value) || 0;
    const line  = qty * price;
    total += line;
    tableHTML += '<tr><td class="c">' + qty + '</td><td>' + (nl2br(desc) || '&nbsp;') + '</td>' +
      '<td class="r">' + fmtGBP(price) + '</td><td class="r">' + fmtGBP(line) + '</td></tr>';
  });
  document.getElementById('pv-lines').innerHTML = tableHTML;

  // Totals
  document.getElementById('s-total').textContent = fmtGBP(total);
  document.getElementById('pv-totals').innerHTML =
    '<div class="inv-totals-row"><span>Total</span><span>' + fmtGBP(total) + '</span></div>';
  document.getElementById('pv-amount').textContent = fmtGBP(total);

  // Header blocks
  let fromHTML = '';
  if (fromName) fromHTML += '<strong>' + nl2br(fromName) + '</strong>';
  if (fromAddr) fromHTML += (fromName ? '<br>' : '') + nl2br(fromAddr);
  document.getElementById('pv-from').innerHTML = fromHTML;

  let metaHTML = '<strong>Invoice no:</strong> ' + escHTML(invNum) + '<br>';
  if (invDate) metaHTML += '<strong>Invoice date:</strong> ' + formatDate(invDate);
  if (dueDate) metaHTML += '<br><strong>Due date:</strong> ' + formatDate(dueDate);
  document.getElementById('pv-meta').innerHTML = metaHTML;

  document.getElementById('pv-billto').innerHTML = nl2br(toInfo) || '—';

  const notesEl = document.getElementById('pv-notes');
  if (notes) { notesEl.innerHTML = '<strong>Notes</strong><br>' + nl2br(notes); notesEl.style.display = ''; }
  else notesEl.style.display = 'none';
}

// ══ INIT ══
(function init() {
  loadSaved();

  // Default dates: today, due in 30 days
  const pad = n => String(n).padStart(2,'0');
  const fmt = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  const today = new Date();
  const due = new Date(today); due.setDate(due.getDate() + 30);
  document.getElementById('inv-date').value = fmt(today);
  document.getElementById('due-date').value = fmt(due);

  addLine('', 1, '');
})();
</script>
</body>
</html>
